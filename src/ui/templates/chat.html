{% extends "base.html" %}

{% block title %}AgenticReader - 对话{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/chat-enhanced.css">
<link rel="stylesheet" href="/static/css/chat.css">
{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-section">
        <div class="chat-header">
            <div>
                <div class="chat-title" id="chat-title">智能对话</div>
                <div style="font-size: 0.875rem; color: var(--text-muted);" id="chat-subtitle">点击 📎 选择文档，或直接开始对话</div>
            </div>
            <div class="chat-actions">
                <button class="btn btn-sm btn-secondary" onclick="window.location.href='/#sessions'" title="会话管理">📜 会话</button>
                <button class="btn btn-sm btn-secondary" id="toggle-pdf">📄 PDF</button>
                <button class="btn btn-sm btn-secondary" id="clear-btn">🗑️ 清空</button>
                <button class="btn btn-sm btn-secondary" onclick="window.location.href='/'">← 返回</button>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="welcome">
                <div style="font-size: 4rem; margin-bottom: 1rem;">💬</div>
                <h3>开始你的深度对话</h3>
                <p>输入问题，获取智能答案</p>
            </div>
        </div>

        <div class="chat-input">
            <!-- 芯片栏：显示已选的文档和工具 -->
            <div id="chips-bar" class="chips-bar" style="display: none;">
                <div id="chips-container" class="chips-container"></div>
            </div>

            <div class="input-wrapper">
                <!-- 工具按钮 -->
                <button id="btn-attach-doc" class="tool-btn" title="选择PDF文档">📎</button>
                <button id="btn-web-search" class="tool-btn" title="启用网络搜索">🌐</button>
                <button id="btn-voice-input" class="tool-btn" title="语音输入">🎤</button>
                <textarea id="message-input" class="form-control" placeholder="直接输入问题开始对话，或点击 📎 选择文档..." disabled></textarea>
                <button id="send-btn" class="btn btn-primary" disabled>⬆️</button>
            </div>

            <!-- 文档选择弹窗 -->
            <div id="doc-picker-modal" class="doc-picker-modal" style="display: none;">
                <div class="doc-picker-content">
                    <div class="doc-picker-header">
                        <span>📚 选择文档</span>
                        <button id="doc-picker-close" class="doc-picker-close-btn">✕</button>
                    </div>
                    <div class="doc-picker-option">
                        <label><input type="checkbox" id="doc-select-all" value="__all__"> 全部文档（自动匹配）</label>
                    </div>
                    <hr style="margin: 0.5rem 0; border-color: var(--border-light);">
                    <div id="doc-picker-list" class="doc-picker-list">
                        <div class="doc-picker-loading">加载中...</div>
                    </div>
                    <div class="doc-picker-footer">
                        <button id="doc-picker-confirm" class="btn btn-primary btn-sm">确认</button>
                    </div>
                </div>
            </div>

            <!-- 快捷导航按钮 -->
            <div id="scroll-buttons-container" class="scroll-buttons-container" style="display: none;">
                <button id="scroll-to-top-btn" class="scroll-nav-btn scroll-to-top" title="回到最早消息">
                    <span class="btn-icon">⬆</span>
                    <span class="btn-text">最早消息</span>
                </button>
                <button id="scroll-to-bottom-btn" class="scroll-nav-btn scroll-to-bottom" title="回到最新内容">
                    <span class="btn-icon">⬇</span>
                    <span class="btn-text">查看最新内容</span>
                    <span id="new-message-badge" class="new-message-badge" style="display: none;">1</span>
                </button>
            </div>

            <div style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">
                <span id="status">未连接</span>
            </div>
        </div>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="pdf-section hidden" id="pdf-section">
        <div class="pdf-header">
            <div>📄 PDF 预览</div>
            <button class="btn btn-sm btn-secondary" id="close-pdf">✕</button>
        </div>

        <!-- PDF选择器（跨文档模式） -->
        <div id="pdf-selector" style="padding: 0.75rem 1rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light); display: none;">
            <label style="font-size: 0.875rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">选择要预览的文档：</label>
            <select id="pdf-select" class="form-control" style="width: 100%;">
                <option value="">-- 请选择文档 --</option>
            </select>
        </div>

        <div class="pdf-viewer" id="pdf-viewer">
            <div style="text-align: center; color: #fff;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">📄</div>
                <p>点击页码引用查看PDF</p>
            </div>
        </div>

        <div class="pdf-toolbar" id="pdf-toolbar" style="display: none;">
            <div class="pdf-nav">
                <button class="btn btn-sm btn-secondary" id="prev-page">◀</button>
                <input type="number" id="page-num" value="1" min="1" style="width: 50px; text-align: center; padding: 4px; border: 1px solid var(--border-light); border-radius: 0.25rem;">
                <span id="page-total">/ 1</span>
                <button class="btn btn-sm btn-secondary" id="next-page">▶</button>
            </div>
            <div class="pdf-zoom">
                <button class="btn btn-sm btn-secondary" id="zoom-out">🔍-</button>
                <span id="zoom-level">100%</span>
                <button class="btn btn-sm btn-secondary" id="zoom-in">🔍+</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- 使用 unpkg 作为备选CDN，更稳定 -->
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
</script>
<script src="https://unpkg.com/marked@11.1.1/marked.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css">
<script src="https://unpkg.com/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui-components.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/chat-enhancer.js"></script>
{% endblock %}
