{% extends "base.html" %}

{% block title %}AgenticReader - Report{% endblock %}

{% block extra_css %}
<style>
    .report-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: var(--spacing-xl) var(--spacing-md);
    }

    .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-lg);
        flex-wrap: wrap;
        gap: var(--spacing-md);
    }

    .page-header h1 {
        font-size: var(--font-size-xxl);
        color: var(--text-primary);
    }

    .date-picker {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .date-picker select {
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: var(--font-size-sm);
    }

    .section-heading {
        font-size: var(--font-size-lg);
        margin: var(--spacing-xl) 0 var(--spacing-md);
        border-bottom: 2px solid var(--border-light);
        padding-bottom: var(--spacing-sm);
        color: var(--text-primary);
    }

    .card {
        border: 1px solid var(--border-light);
        border-radius: 10px;
        background: var(--bg-primary);
        padding: var(--spacing-lg);
        margin-bottom: var(--spacing-md);
    }

    .card-badge {
        display: inline-block;
        background: var(--primary-color);
        color: var(--text-white);
        font-size: var(--font-size-xs);
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 999px;
        margin-bottom: var(--spacing-sm);
    }

    .card h3 {
        margin: var(--spacing-xs) 0 var(--spacing-sm);
        font-size: var(--font-size-lg);
    }

    .card .meta {
        color: var(--text-muted);
        font-size: var(--font-size-sm);
        margin-bottom: var(--spacing-sm);
    }

    .card .links a {
        color: var(--primary-color);
        margin-right: var(--spacing-md);
        text-decoration: none;
        font-size: var(--font-size-sm);
    }

    .qa-brief-list {
        list-style: none;
        padding: 0;
        margin: var(--spacing-sm) 0;
    }

    .qa-brief-list li {
        padding: 4px 0;
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
    }

    .qa-brief-list b {
        color: var(--text-primary);
    }

    details.deep-qa {
        margin-top: var(--spacing-sm);
        background: var(--bg-secondary);
        border-radius: 8px;
        padding: var(--spacing-sm) var(--spacing-md);
    }

    details.deep-qa summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--primary-color);
        font-size: var(--font-size-sm);
    }

    dl { margin: var(--spacing-sm) 0 0; }
    dt { font-weight: 700; color: var(--primary-color); margin-top: var(--spacing-sm); font-size: var(--font-size-sm); }
    dd { margin: 4px 0 0; font-size: var(--font-size-sm); color: var(--text-secondary); }

    .card-actions {
        margin-top: var(--spacing-sm);
        display: flex;
        gap: var(--spacing-sm);
    }

    .card-actions button {
        font-size: var(--font-size-xs);
        padding: 4px 10px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: var(--bg-primary);
        color: var(--text-primary);
        cursor: pointer;
    }

    .card-actions button.danger {
        color: var(--danger-color);
        border-color: var(--danger-color);
    }

    .empty-hint {
        color: var(--text-muted);
        font-size: var(--font-size-sm);
    }
</style>
{% endblock %}

{% block content %}
<div class="report-container">
    <div class="page-header">
        <h1>📄 Report</h1>
        <div class="date-picker">
            <label for="coverage-date-select">覆盖日期</label>
            <select id="coverage-date-select"></select>
        </div>
    </div>

    <h2 class="section-heading">📄 论文深度解析 (<span id="pdf-count">0</span>)</h2>
    <div id="pdf-list"></div>

    <h2 class="section-heading">🌐 文章深度解析 (<span id="web-count">0</span>)</h2>
    <div id="web-list"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>window.QA_LABELS = {{ qa_labels_json | safe }};</script>
<script src="/static/js/report.js"></script>
{% endblock %}
