{% extends "base.html" %}

{% block title %}AgenticReader - 每日简报{% endblock %}

{% block extra_css %}
<style>
    .briefs-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: var(--spacing-xl) var(--spacing-md);
    }

    .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-lg);
        flex-wrap: wrap;
        gap: var(--spacing-md);
        /* 吸顶：勾选完文章后不用再滑回顶部找"加载选中"/"生成报告"这些
           按钮。top 用 --header-height 而不是 0——页面顶部的导航栏本身
           是 fixed 定位占了这么高，吸到 0 会被导航栏盖住。需要实心
           背景，否则下面卡片滚动上来时会透出来看着很乱。 */
        position: sticky;
        top: var(--header-height);
        z-index: 10;
        background: var(--bg-secondary);
        padding: var(--spacing-md) 0;
    }

    .toolbar {
        display: flex;
        gap: var(--spacing-sm);
        align-items: center;
        flex-wrap: wrap;
    }

    .toolbar select, .toolbar button {
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: var(--font-size-sm);
        background: var(--bg-primary);
        /* 原生 <button>/<select> 的文字颜色不会自动继承页面的
           --text-primary，只设置背景不设置文字色的话，深色模式下背景变
           暗但文字还是浏览器默认的深色系统色，糊在一起看不清（"生成报告"/
           "补灌记忆"就是这样）。 */
        color: var(--text-primary);
        cursor: pointer;
    }

    .toolbar button.primary {
        background: var(--primary-color);
        color: var(--text-white);
        border-color: var(--primary-color);
    }

    .section-heading {
        display: flex;
        align-items: baseline;
        gap: var(--spacing-md);
    }

    /* 无边框的次要文字按钮，用在标题栏里不抢视觉焦点（"全部展开"/
       "全部收起"）。 */
    .link-btn {
        background: none;
        border: none;
        color: var(--primary-color);
        font-size: var(--font-size-sm);
        font-weight: 500;
        cursor: pointer;
        padding: 0;
    }

    .link-btn:hover {
        text-decoration: underline;
    }

    .card-list {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
    }

    /* 卡片默认收起：只露标题+徽章+中文导读第一条，点击卡头展开/收起
       （交互模式改自 ai-research-pipeline 的 webapp/static/css/briefs.css，
       一天几十张卡全展开会有上万像素，收起态才扫得动列表）。 */
    .brief-card {
        display: flex;
        align-items: flex-start;
        gap: var(--spacing-sm);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: var(--spacing-md);
        background: var(--bg-primary);
    }

    .brief-card.is-done {
        opacity: 0.62;
    }

    .card-check {
        padding-top: 4px;
    }

    .card-check input {
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .card-body {
        flex: 1;
        min-width: 0;
    }

    .card-head {
        display: flex;
        align-items: baseline;
        gap: var(--spacing-sm);
        flex-wrap: wrap;
        cursor: pointer;
    }

    .card-title {
        font-size: var(--font-size-md);
        font-weight: 700;
        margin: 0;
    }

    .card-toggle {
        color: var(--text-muted);
        font-size: var(--font-size-xs);
        margin-left: auto;
        flex-shrink: 0;
        transition: transform 0.15s;
    }

    .brief-card.expanded .card-toggle {
        transform: rotate(90deg);
    }

    /* 收起态：中文导读只留第一条、clamp 两行做扫读，主题/链接/更多信息
       整块隐藏；展开后恢复正常留白。 */
    .brief-card:not(.expanded) .card-title {
        font-size: var(--font-size-sm);
        line-height: 1.45;
    }

    .brief-card:not(.expanded) .cn-block {
        margin-top: 5px;
    }

    .brief-card:not(.expanded) .cn-item {
        margin: 0;
        font-size: var(--font-size-sm);
        line-height: 1.5;
    }

    .brief-card:not(.expanded) .cn-item:not(:first-child),
    .brief-card:not(.expanded) .themes,
    .brief-card:not(.expanded) .card-links,
    .brief-card:not(.expanded) details.more {
        display: none;
    }

    .brief-card:not(.expanded) .cn-item:first-child {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .status-badge, .score-chip {
        font-size: var(--font-size-xs);
        padding: 2px 9px;
        border-radius: 999px;
        font-weight: 600;
        white-space: nowrap;
    }

    .score-chip {
        background: var(--bg-tertiary);
        color: var(--text-muted);
        border: 1px solid var(--border-light);
    }

    .status-not_loaded { background: var(--bg-tertiary); color: var(--text-muted); }
    .status-queued { background: #fef3c7; color: #92400e; }
    .status-done { background: #d1fae5; color: #065f46; }
    .status-failed { background: #fee2e2; color: #991b1b; }

    .themes {
        margin: 8px 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .theme-chip {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: var(--font-size-xs);
        color: var(--text-muted);
    }

    .cn-block {
        margin-top: var(--spacing-sm);
    }

    .cn-item {
        margin: 5px 0;
        font-size: var(--font-size-sm);
    }

    .cn-item.cn-empty {
        color: var(--text-muted);
        font-style: italic;
    }

    .cn-label {
        color: var(--primary-color);
        font-weight: 700;
    }

    .card-links {
        margin-top: var(--spacing-sm);
        font-size: var(--font-size-sm);
    }

    .card-links a {
        color: var(--primary-color);
        margin-right: var(--spacing-md);
        text-decoration: none;
    }

    .card-links a:hover {
        text-decoration: underline;
    }

    details.more {
        margin-top: var(--spacing-sm);
    }

    details.more summary {
        cursor: pointer;
        color: var(--primary-color);
        font-size: var(--font-size-sm);
        font-weight: 600;
    }

    details.more .more-body {
        margin-top: var(--spacing-sm);
        font-size: var(--font-size-sm);
        color: var(--text-muted);
    }

    details.more .more-body p {
        margin: 6px 0;
    }

    .jobs-panel {
        margin-top: var(--spacing-xl);
        border-top: 1px solid var(--border-light);
        padding-top: var(--spacing-md);
    }

    .jobs-panel table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-sm);
    }

    .jobs-panel th, .jobs-panel td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border-light);
    }

    .job-cancel-btn {
        font-size: var(--font-size-xs);
        padding: 3px 10px;
        border: 1px solid var(--danger-color);
        border-radius: 6px;
        background: var(--bg-primary);
        color: var(--danger-color);
        cursor: pointer;
    }

    .job-cancel-btn:hover {
        background: var(--danger-color);
        color: var(--text-white);
    }

    .job-cancel-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>
{% endblock %}

{% block content %}
<div class="briefs-container">
    <div class="page-header">
        <h1>📰 每日简报</h1>
        <div class="toolbar">
            <select id="brief-date-select"></select>
            <button id="select-all-btn">全选</button>
            <button id="load-selected-btn" class="primary">加载选中</button>
            <button id="render-report-btn">生成报告</button>
            <button id="sync-memory-btn">补灌记忆</button>
        </div>
    </div>

    <h2 class="section-heading">
        📄 论文 (<span id="brief-pdf-count">0</span>)
        <button class="link-btn" id="pdf-toggle-all-btn" type="button">全部展开</button>
    </h2>
    <div id="brief-pdf-list" class="card-list"></div>

    <h2 class="section-heading">
        🌐 文章 (<span id="brief-web-count">0</span>)
        <button class="link-btn" id="web-toggle-all-btn" type="button">全部展开</button>
    </h2>
    <div id="brief-web-list" class="card-list"></div>

    <div class="jobs-panel">
        <h3>后台任务</h3>
        <table>
            <thead><tr><th>目标</th><th>类型</th><th>状态</th><th>创建时间</th><th>错误</th><th>操作</th></tr></thead>
            <tbody id="jobs-tbody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/briefs.js?v=4"></script>
{% endblock %}
